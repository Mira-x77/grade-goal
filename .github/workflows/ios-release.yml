name: iOS release (signed IPA)

# Archive + export a signed .ipa on a macOS runner, using a paid Apple Developer
# account. This is the App Store / TestFlight path; for free-Apple-ID sideloading
# use ios.yml (unsigned) plus Sideloadly/AltStore instead.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#
#   IOS_TEAM_ID                 Apple Developer Team ID (10 chars)
#   IOS_DIST_CERT_P12           base64 of the "Apple Distribution" .p12
#   IOS_DIST_CERT_PASSWORD      password used when exporting that .p12
#   IOS_PROFILE_SPECIFIER       exact name of the App Store provisioning profile
#   IOS_PROVISIONING_PROFILE    base64 of that .mobileprovision file
#   VITE_SUPABASE_PROJECT_ID    web build config
#   VITE_SUPABASE_URL
#   VITE_SUPABASE_ANON_KEY
#
# Optional, to upload straight to App Store Connect:
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY (base64 of AuthKey_XXXX.p8)
#
# Without the signing secrets the job stops after one explanatory message.

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: 'Export method'
        type: choice
        default: app-store-connect
        options:
          - app-store-connect
          - ad-hoc
          - development
          - enterprise

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check signing secrets
        id: gate
        env:
          TEAM: ${{ secrets.IOS_TEAM_ID }}
          CERT: ${{ secrets.IOS_DIST_CERT_P12 }}
          CERT_PW: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_NAME: ${{ secrets.IOS_PROFILE_SPECIFIER }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          missing=""
          [ -n "$TEAM" ] || missing="$missing IOS_TEAM_ID"
          [ -n "$CERT" ] || missing="$missing IOS_DIST_CERT_P12"
          [ -n "$CERT_PW" ] || missing="$missing IOS_DIST_CERT_PASSWORD"
          [ -n "$PROFILE_NAME" ] || missing="$missing IOS_PROFILE_SPECIFIER"
          [ -n "$PROFILE" ] || missing="$missing IOS_PROVISIONING_PROFILE"
          if [ -n "$missing" ]; then
            echo "::warning::Signing secrets not configured:$missing — skipping the signed build."
            echo "Use the 'iOS build (unsigned IPA)' workflow for free-Apple-ID sideloading."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        run: npm ci --legacy-peer-deps

      - name: Write .env for the web build
        if: steps.gate.outputs.ready == 'true'
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          CATALOG_URL: ${{ secrets.VITE_CATALOG_URL }}
        run: |
          set -euo pipefail
          {
            printf 'VITE_SUPABASE_PROJECT_ID=%s\n' "$SUPABASE_PROJECT_ID"
            printf 'VITE_SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'VITE_SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY"
            printf 'VITE_APP_URL=%s\n' "https://gostudy.app"
            printf 'VITE_CATALOG_URL=%s\n' "${CATALOG_URL:-https://pub-91f336347bd944c48d724d28d0d3b647.r2.dev/catalog}"
          } > .env

      - name: Build web assets and sync iOS
        if: steps.gate.outputs.ready == 'true'
        run: |
          npm run build
          npx cap sync ios
          npm run ios:prepare

      - name: Install signing certificate and provisioning profile
        if: steps.gate.outputs.ready == 'true'
        env:
          CERT: ${{ secrets.IOS_DIST_CERT_P12 }}
          CERT_PW: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"

          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PW" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE" | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/App.mobileprovision"

          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Archive
        if: steps.gate.outputs.ready == 'true'
        env:
          TEAM: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROFILE_SPECIFIER }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/GoStudy.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            | tee "$RUNNER_TEMP/archive.log" | tail -n 40

      - name: Export .ipa
        if: steps.gate.outputs.ready == 'true'
        env:
          TEAM: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROFILE_SPECIFIER }}
          METHOD: ${{ github.event.inputs.export_method || 'app-store-connect' }}
        run: |
          set -euo pipefail
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleIdentifier' \
            "$RUNNER_TEMP/GoStudy.xcarchive/Info.plist")"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>$METHOD</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>stripSwiftSymbols</key><true/>
            <key>compileBitcode</key><false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/GoStudy.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            | tee "$RUNNER_TEMP/export.log" | tail -n 30

          ls -lh "$RUNNER_TEMP/export"

      - name: Rename .ipa
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          IPA="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' | head -n 1)"
          test -n "$IPA"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            "$RUNNER_TEMP/GoStudy.xcarchive/Products/Applications/App.app/Info.plist")"
          BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' \
            "$RUNNER_TEMP/GoStudy.xcarchive/Products/Applications/App.app/Info.plist")"
          cp "$IPA" "GoStudy-${VERSION}-${BUILD_NUMBER}.ipa"
          ls -lh GoStudy-*.ipa

      - name: Upload signed .ipa
        if: steps.gate.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gostudy-ios-signed-ipa
          path: 'GoStudy-*.ipa'
          retention-days: 30
          if-no-files-found: error

      - name: Upload to App Store Connect (optional)
        if: steps.gate.outputs.ready == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_PRIVATE_KEY" ]; then
            echo "App Store Connect API key not configured; skipping upload."
            echo "Upload manually with the Transporter app or Xcode instead."
            exit 0
          fi
          IPA="$(ls GoStudy-*.ipa | head -n 1)"
          mkdir -p "$HOME/private_keys"
          echo "$ASC_PRIVATE_KEY" | base64 --decode > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --verbose
