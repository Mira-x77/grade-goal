    <!-- PDF.js polyfills before app bundle (Android WebView lacks Promise.withResolvers) -->
    <script>
      (function () {
        if (typeof globalThis === "undefined") {
          window.globalThis = window;
        }
        if (!Object.fromEntries) {
          Object.fromEntries = function (entries) {
            var out = {};
            for (var i = 0; i < entries.length; i++) {
              var pair = entries[i];
              out[pair[0]] = pair[1];
            }
            return out;
          };
        }
        if (!Array.prototype.flat) {
          Array.prototype.flat = function (depth) {
            depth = depth === undefined ? 1 : Math.floor(depth) || 1;
            var result = [];
            var arr = this;
            for (var i = 0; i < arr.length; i++) {
              var val = arr[i];
              if (depth > 0 && Object.prototype.toString.call(val) === "[object Array]") {
                result.push.apply(result, val.flat(depth - 1));
              } else {
                result.push(val);
              }
            }
            return result;
          };
        }
        if (typeof Promise.withResolvers !== "function") {
          Promise.withResolvers = function () {
            var resolve, reject;
            var promise = new Promise(function (res, rej) {
              resolve = res;
              reject = rej;
            });
            return { promise: promise, resolve: resolve, reject: reject };
          };
        }
        if (typeof Promise.try !== "function") {
          Promise.try = function (fn) {
            var args = Array.prototype.slice.call(arguments, 1);
            return new Promise(function (resolve, reject) {
              try {
                resolve(fn.apply(null, args));
              } catch (e) {
                reject(e);
              }
            });
          };
        }
        if (typeof URL.parse !== "function") {
          URL.parse = function (url, base) {
            try {
              return new URL(url, base);
            } catch (e) {
              return null;
            }
          };
        }
      })();
    </script>
