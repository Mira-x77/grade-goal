<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Go Study flyer — story</title>
<link rel="stylesheet" href="flyer.css" />
<style>
  .canvas { width: 1080px; height: 1920px; background: var(--yellow); }
  .canvas .dots { background-image: radial-gradient(rgba(23,22,20,.18) 1.8px, transparent 1.9px); background-size: 32px 32px; }
  .sheet { position: absolute; z-index: 1; left: 0; right: 0; top: 706px; bottom: 0; background: var(--paper); border-top: 5px solid var(--ink); }
  .sheet .dots { background-image: radial-gradient(rgba(23,22,20,.13) 1.6px, transparent 1.7px); background-size: 30px 30px; }

  .logo { position: absolute; z-index: 20; left: 50%; top: 56px; width: 236px; transform: translateX(-50%); }
  .kicker { position: absolute; z-index: 20; left: 0; right: 0; top: 300px; text-align: center; font-size: 18px; letter-spacing: .2em; }

  .headline { position: absolute; z-index: 20; left: 0; right: 0; top: 354px; text-align: center; font-size: 104px; line-height: .91; }
  .headline .marker::before { background: #fff; }

  .sub { position: absolute; z-index: 20; left: 0; right: 0; top: 646px; text-align: center; font-size: 26px; font-weight: 800; }

  .phone-s { position: absolute; z-index: 8; left: 50%; top: 802px; width: 470px; height: 982px; transform: translateX(-50%) rotate(-2deg); box-shadow: none; }

  .sticker-l {
    position: absolute; z-index: 30; left: 34px; top: 906px; transform: rotate(-6deg);
    background: #fff; border: 5px solid var(--ink); border-radius: 26px; padding: 18px 22px;
    box-shadow: 9px 9px 0 var(--ink); width: 246px;
  }
  .sticker-l .cap { font-size: 12px; font-weight: 900; letter-spacing: .18em; opacity: .55; }
  .sticker-l .big { font-size: 58px; font-weight: 900; letter-spacing: -.05em; line-height: 1; margin-top: 2px; }
  .sticker-l .big small { font-size: 24px; opacity: .45; }

  .sticker-r {
    position: absolute; z-index: 30; right: 36px; top: 1112px; transform: rotate(5deg);
    background: var(--ink); color: #fff; border-radius: 22px; padding: 14px 20px;
    display: flex; align-items: center; gap: 12px; box-shadow: 7px 7px 0 rgba(23,22,20,.3);
  }
  .sticker-r .flame { font-size: 42px; line-height: 1; }
  .sticker-r b { font-size: 34px; font-weight: 900; display: block; line-height: .9; }
  .sticker-r span { font-size: 12px; letter-spacing: .16em; font-weight: 900; opacity: .65; }

  .sticker-p {
    position: absolute; z-index: 30; right: 48px; top: 1350px; transform: rotate(-4deg);
    background: var(--yellow); border: 4px solid var(--ink); border-radius: 16px; padding: 11px 18px;
    font-size: 17px; font-weight: 900; box-shadow: 5px 5px 0 var(--ink);
  }

  .mascot-s { position: absolute; z-index: 26; left: 30px; top: 1420px; width: 250px; transform: rotate(-5deg); }

  .cta-bar {
    position: absolute; z-index: 40; left: 46px; right: 46px; bottom: 132px;
    background: var(--ink); border-radius: 28px; padding: 20px 26px; color: #fff;
    display: flex; align-items: center; justify-content: space-between;
  }
  .cta-bar .go { background: var(--yellow); color: var(--ink); border-radius: 999px; padding: 14px 28px; font-size: 25px; font-weight: 900; }
  .cta-bar .url { font-size: 24px; }
  .cta-bar small { display: block; text-align: right; font-size: 12px; font-weight: 900; letter-spacing: .14em; opacity: .55; margin-top: 5px; }

  .swipe { position: absolute; z-index: 40; left: 0; right: 0; bottom: 40px; display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 15px; font-weight: 900; letter-spacing: .2em; text-transform: uppercase; opacity: .55; }
  .swipe .arr { font-size: 22px; }
</style>
</head>
<body>
<div class="canvas">
  <div class="dots"></div>
  <div class="sheet"><div class="dots"></div></div>

  <img class="logo" src="/presentations/assets/icon_clean.png" alt="Go Study" />
  <div class="kicker">THE STUDY APP FOR BAC · BEPC · PROBATOIRE</div>

  <h1 class="headline display">
    Your marks.<br />
    Your <span class="marker">average.</span><br />
    Your plan.
  </h1>

  <p class="sub">Everything you need to hit your target — free to start.</p>

  <div class="phone phone-s">
    <img src="shots/home.png" alt="Go Study home dashboard" />
  </div>

  <div class="sticker-l">
    <div class="cap">YOUR AVERAGE</div>
    <div class="big">15.7<small> /20</small></div>
  </div>

  <div class="sticker-r">
    <div class="flame">🔥</div>
    <div><b>7</b><span>DAY STREAK</span></div>
  </div>

  <div class="sticker-p">60+ past papers</div>
  <div class="mascot mascot-s"><img src="/presentations/assets/read.png" alt="" /></div>

  <div class="cta-bar">
    <div class="go">Start free →</div>
    <div>
      <div class="url">goostudy.vercel.app</div>
      <small>ANDROID &amp; WEB</small>
    </div>
  </div>
</div>
</body>
</html>
